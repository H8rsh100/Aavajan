name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Check compilation
        run: cargo check --locked
      - name: Run tests
        run: cargo test --locked
      - name: Run clippy
        run: cargo clippy --locked -- -D warnings
